---
version: "3.8"

services:
  llama-server:
    # Latest as of 2026-11-08: "server-vulkan-b12199"
    # image: ghcr.io/ggml-org/llama.cpp@sha256:5f372e6bbbd8ec1fd505d3094b5d9812b3caff052a9f24c52e269fe4f33cb39e
    image: ghcr.io/ggml-org/llama.cpp:server-cuda
    container_name: llama-server
    ports:
      - "9931:9931"
    networks:
      - pi-network
    volumes:
      - type: bind
        source: '/data/llm_models'
        target: '/models'
        read_only: true
      # Replacing /usr/local/cuda/compat within the container with an empty
      # directory prevents CUDA version mismatches from failing to initialize
      # CUDA.
      # The host drivers are CUDA 12.4, the container drivers are CUDA 12.8,
      # and my GeForce RTX 3050 cannot use the forward compatibilty layer.
      # Without this bind mount, we get "ggml_cuda_init: failed to initialize
      # CUDA: forward compatibilty was attmped on non-supported HW" and things
      # would fall back to CPU rather than using the GPU.
      - type: bind
        source: "${EMPTY_CUDA_DIR}"
        target: /usr/local/cuda/compat
        read_only: true
    command:
      # Tell llama where to expose the service
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "9931"
      - "--models-autoload"
      # Load max layers onto the GPU: "number of GPU layers"
      - "-ngl"
      - "99"
    devices:
      # grant the container access to all GPUs on the host
      - "nvidia.com/gpu=all"
    security_opt:
      # Needed because I'm using podman, and podman by default doesn't allow
      # access to the GPU (something-something SELinux)
      - "label=disable"
    environment:
      - LLAMA_CACHE=/models
    restart: unless-stopped

  pi:
    build:
      context: .
      dockerfile: pi.Dockerfile
    container_name: pi
    stdin_open: true
    tty: true
    networks:
      - pi-network
    depends_on:
      - llama-server
    environment:
      - LLAMA_BASE_URL=http://llama-server:9931
      - LLAMA_API_KEY=""
    volumes:
      - type: bind
        source: "${WORKSPACE_PATH}"
        target: '/workspace'
      - type: volume
        source: 'pi-agent-home'
        target: '/root/.pi/agent'

  goose:
    build:
      context: .
      dockerfile: goose.Dockerfile
    container_name: goose
    stdin_open: true
    tty: true
    networks:
      - pi-network
    depends_on:
      - llama-server
    user: "0:0"  # ew, do not like. This causes container to run as root.
    security_opt:
      # Needed because I'm using podman, and podman by default doesn't allow
      # access to the GPU (something-something SELinux)
      - "label=disable"
    environment:
      - GOOSE_PROVIDER=openai
      - GOOSE_MODEL=google/gemma-4-E2B-it-qat-q4_0-gguf:IT
      - OPENAI_HOST=http://llama-server:9931
      - OPENAI_BASE_PATH=v1/chat/completions
      - OPENAI_API_KEY=none
    volumes:
      - type: bind
        source: "${WORKSPACE_PATH}"
        target: '/workspace'
      - type: volume
        source: 'goose-config'
        target: '/root/.config/goose'

  aider:
    # latest as of 2026-11-14
    # image: docker.io/paulgauthier/aider@sha256:5b18f6c24f137a165dccda3ddf475a6ae2122c1e083f3d763e3358d129dcf0a4
    image: docker.io/paulgauthier/aider:latest
    container_name: aider
    networks:
      - pi-network
    depends_on:
      - llama-server
    environment:
      - OPENAI_API_BASE=http://llama-server:9931/v1
      - OPENAI_API_KEY=none
    volumes:
      - type: bind
        source: "${WORKSPACE_PATH}"
        target: '/app'
        read_only: false
      # - type: volume
      #   source: 'aider-agent-home'
      #   target: '/app'
      #   read_only: false
    working_dir: /app
    stdin_open: true
    tty: true
    user: "0:0"  # ew, do not like. This causes container to run as root.
    security_opt:
      # Needed because I'm using podman, and podman by default doesn't allow
      # access to the GPU (something-something SELinux)
      - "label=disable"
    command:
      - "--model"
      - "openai/google/gemma-4-E2B-it-qat-q4_0-gguf:IT"
      # - "openai/bartowski/Llama-3.2-3B-Instruct-uncensored-GGUF:Q6_K"
      # Adjust edit format because local LLMs are apparnetly not super great at diffs
      - "--edit-format"
      - "whole"


volumes:
  pi-agent-home:
  goose-config:

networks:
  pi-network:
    driver: bridge
